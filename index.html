<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <meta name="theme-color" content="#050505"> <title>BASEL BROWSER</title> <style> * { box-sizing: border-box; } :root { --bg: #050505; --card: rgba(255,255,255,.07); --border: rgba(255,255,255,.12); --text: #ffffff; --muted: #8c8c8c; --accent: #ffffff; } html, body { margin: 0; width: 100%; min-height: 100%; } body { font-family: Inter, Arial, Helvetica, sans-serif; background: radial-gradient(circle at 20% 20%, rgba(255,255,255,.08), transparent 25%), radial-gradient(circle at 80% 70%, rgba(255,255,255,.06), transparent 25%), #050505; color: var(--text); overflow-x: hidden; } /* Animated background */ .background { position: fixed; inset: 0; z-index: -1; overflow: hidden; } .orb { position: absolute; border-radius: 50%; filter: blur(100px); opacity: .13; animation: float 12s infinite alternate ease-in-out; } .orb.one { width: 300px; height: 300px; background: white; top: -100px; left: -100px; } .orb.two { width: 350px; height: 350px; background: #777; bottom: -150px; right: -100px; animation-delay: -4s; } @keyframes float { from { transform: translate(0,0) scale(1); } to { transform: translate(60px,40px) scale(1.15); } } /* Top bar */ .topbar { width: calc(100% - 32px); max-width: 1250px; margin: 16px auto; height: 64px; display: flex; align-items: center; gap: 14px; padding: 10px 14px; border: 1px solid var(--border); background: rgba(15,15,15,.65); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border-radius: 20px; box-shadow: 0 15px 50px rgba(0,0,0,.35); } .logo { font-weight: 900; letter-spacing: -1px; font-size: 20px; white-space: nowrap; } .logo span { color: #777; } .nav-buttons { display: flex; gap: 6px; } .nav-btn { width: 38px; height: 38px; border: 0; border-radius: 12px; background: rgba(255,255,255,.06); color: white; font-size: 17px; cursor: pointer; transition: .2s; } .nav-btn:hover { background: rgba(255,255,255,.14); transform: translateY(-2px); } .address { flex: 1; min-width: 0; height: 42px; display: flex; align-items: center; padding: 0 16px; border-radius: 13px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.07); color: #aaa; overflow: hidden; white-space: nowrap; } .address span { overflow: hidden; text-overflow: ellipsis; } /* Main */ .main { width: calc(100% - 32px); max-width: 1050px; margin: 0 auto; padding: 70px 0 40px; text-align: center; } .badge { display: inline-flex; align-items: center; gap: 8px; padding: 8px 13px; border: 1px solid var(--border); border-radius: 999px; background: rgba(255,255,255,.05); color: #aaa; font-size: 13px; margin-bottom: 22px; } .dot { width: 7px; height: 7px; border-radius: 50%; background: white; box-shadow: 0 0 12px white; } h1 { margin: 0; font-size: clamp(58px, 11vw, 145px); line-height: .82; letter-spacing: -8px; font-weight: 950; background: linear-gradient( 180deg, #ffffff 0%, #ffffff 35%, #555 100% ); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 20px 80px rgba(255,255,255,.08); } .subtitle { margin-top: 25px; color: #777; font-size: 16px; letter-spacing: 3px; text-transform: uppercase; } /* Search */ .search-wrap { margin: 48px auto 0; max-width: 760px; } .search { display: flex; align-items: center; height: 68px; padding: 7px; border-radius: 22px; background: rgba(255,255,255,.075); border: 1px solid rgba(255,255,255,.15); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); box-shadow: 0 20px 70px rgba(0,0,0,.45), inset 0 1px rgba(255,255,255,.08); transition: .25s; } .search:focus-within { border-color: rgba(255,255,255,.35); box-shadow: 0 20px 80px rgba(0,0,0,.5), 0 0 0 4px rgba(255,255,255,.04); } .search-icon { width: 48px; font-size: 22px; color: #888; } input { flex: 1; height: 100%; border: 0; outline: 0; background: transparent; color: white; font-size: 18px; min-width: 0; } input::placeholder { color: #666; } .search-button { height: 54px; padding: 0 23px; border: 0; border-radius: 16px; background: white; color: black; font-weight: 800; cursor: pointer; transition: .2s; } .search-button:hover { transform: scale(1.03); box-shadow: 0 8px 30px rgba(255,255,255,.15); } /* Shortcut cards */ .section-title { text-align: left; color: #777; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; margin: 55px 0 14px; } .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; } .card { position: relative; min-height: 120px; padding: 20px; border-radius: 20px; border: 1px solid var(--border); background: var(--card); text-align: left; cursor: pointer; overflow: hidden; transition: .25s; } .card::after { content: ""; position: absolute; width: 100px; height: 100px; right: -40px; bottom: -50px; border-radius: 50%; background: white; filter: blur(45px); opacity: .06; } .card:hover { transform: translateY(-6px); border-color: rgba(255,255,255,.25); background: rgba(255,255,255,.1); } .card-icon { font-size: 27px; margin-bottom: 16px; } .card-title { font-weight: 800; font-size: 15px; } .card-description { margin-top: 5px; color: #777; font-size: 12px; } /* Bottom information */ .info { display: flex; justify-content: space-between; align-items: center; margin-top: 35px; color: #555; font-size: 12px; } .clock { font-variant-numeric: tabular-nums; } /* Recent */ .recent { margin-top: 12px; text-align: left; } .recent-item { display: inline-block; margin: 5px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 999px; color: #888; font-size: 12px; cursor: pointer; } .recent-item:hover { color: white; background: rgba(255,255,255,.06); } /* Mobile */ @media (max-width: 700px) { .topbar { margin: 10px auto; width: calc(100% - 20px); } .logo { display: none; } .main { width: calc(100% - 24px); padding-top: 55px; } h1 { letter-spacing: -4px; font-size: 72px; } .subtitle { font-size: 12px; letter-spacing: 2px; } .search { height: 60px; border-radius: 18px; } .search-button { height: 46px; padding: 0 16px; border-radius: 13px; } .cards { grid-template-columns: repeat(2, 1fr); } .card { min-height: 110px; } .info { flex-direction: column; gap: 10px; } } </style> </head> <body> <div class="background"> <div class="orb one"></div> <div class="orb two"></div> </div> <!-- Browser-style top bar --> <header class="topbar"> <div class="logo"> BASEL<span>/BROWSER</span> </div> <div class="nav-buttons"> <button class="nav-btn" onclick="history.back()" title="Back">‹</button> <button class="nav-btn" onclick="history.forward()" title="Forward">›</button> <button class="nav-btn" onclick="location.reload()" title="Reload">↻</button> </div> <div class="address"> <span>🔒 &nbsp; basel.browser</span> </div> </header> <main class="main"> <div class="badge"> <span class="dot"></span> BASEL BROWSER ONLINE </div> <h1>BASEL</h1> <div class="subtitle"> Search. Explore. Discover. </div> <!-- Search --> <div class="search-wrap"> <form class="search" onsubmit="searchWeb(event)"> <div class="search-icon">⌕</div> <input id="searchBox" type="text" placeholder="Search the web..." autocomplete="off" autofocus > <button class="search-button" type="submit"> Search </button> </form> </div> <!-- Quick links --> <div class="section-title"> Quick access </div> <div class="cards"> <div class="card" onclick="openSite('https://www.youtube.com/')"> <div class="card-icon">▶</div> <div class="card-title">YouTube</div> <div class="card-description">Videos & creators</div> </div> <div class="card" onclick="openSite('https://www.google.com/')"> <div class="card-icon">G</div> <div class="card-title">Google</div> <div class="card-description">Search the web</div> </div> <div class="card" onclick="openSite('https://www.wikipedia.org/')"> <div class="card-icon">W</div> <div class="card-title">Wikipedia</div> <div class="card-description">Explore knowledge</div> </div> <div class="card" onclick="openSite('https://www.bing.com/')"> <div class="card-icon">◈</div> <div class="card-title">Bing</div> <div class="card-description">Web search</div> </div> </div> <!-- Recent searches --> <div class="section-title"> Recent searches </div> <div id="recent" class="recent"></div> <div class="info"> <span>Made with ♥ by Basel</span> <span class="clock" id="clock">--:--:--</span> <span>Powered by S3</span> </div> </main> <script> /* Search */ function searchWeb(event) { event.preventDefault(); const box = document.getElementById("searchBox"); const query = box.value.trim(); if (!query) { box.focus(); return; } saveSearch(query); window.location.href = "https://www.google.com/search?q=" + encodeURIComponent(query); } /* Open website */ function openSite(url) { window.location.href = url; } /* Recent searches */ function saveSearch(query) { let searches = JSON.parse(localStorage.getItem("baselSearches") || "[]"); searches = searches.filter(x => x !== query); searches.unshift(query); searches = searches.slice(0, 6); localStorage.setItem( "baselSearches", JSON.stringify(searches) ); displayRecent(); } function displayRecent() { const container = document.getElementById("recent"); let searches = JSON.parse(localStorage.getItem("baselSearches") || "[]"); container.innerHTML = ""; searches.forEach(query => { const item = document.createElement("span"); item.className = "recent-item"; item.textContent = query; item.onclick = function() { document.getElementById("searchBox").value = query; searchWeb({ preventDefault: function() {} }); }; container.appendChild(item); }); } /* Clock */ function updateClock() { const now = new Date(); document.getElementById("clock").textContent = now.toLocaleTimeString(); } setInterval(updateClock, 1000); updateClock(); displayRecent(); /* Keyboard shortcut */ document.addEventListener("keydown", function(event) { if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "k") { event.preventDefault(); document.getElementById("searchBox").focus(); } if (event.key === "/") { if (document.activeElement.tagName !== "INPUT") { event.preventDefault(); document.getElementById("searchBox").focus(); } } }); </script> </body> </html>
